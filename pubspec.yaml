name: musicplayer
description: Lokaler Musikplayer mit Playlist-Abschnitten
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  just_audio: ^0.9.46
  just_audio_media_kit: ^2.0.0
  media_kit_libs_linux: any
  audio_metadata_reader: ^1.4.2
  file_picker: ^8.0.0
  scrollable_positioned_list: ^0.3.8
  sensors_plus: ^6.1.1
  audio_service: ^0.18.15
  audio_session: ^0.1.25

flutter:
  uses-material-design: true